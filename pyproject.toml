[project]
name = "sales-agent"
version = "0.1.0"
description = "Seller-side agent for AI buying agents: experiments harness"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
api = ["anthropic>=0.60"]
# Armature MCP analytics (ingest key: ANALYTICS_INGEST_API_KEY). See docs/tracks/armature.md
analytics = ["armature-mcp-analytics[mcp]>=0.1.42"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sales_agent"]
